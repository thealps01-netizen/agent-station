name: subagent-watch
label: Subagent Watch
version: 1.7.0
description: >-
  Subagent Watch — read-only desktop page for delegate_task workers, in three looks (Dot
  matrix, Live map, Terminal; chosen in Settings): the main agent and each subagent as a unit showing what it does, one focus panel
  with its files, answer and cost, earlier runs in a picker, full worker output; a status-bar
  progress chip (and pet line) for the running batch; plus the chat's background shell
  commands (running and finished, with exit code and output tail).
author: Muhammed Enes Alpler
kind: standalone
