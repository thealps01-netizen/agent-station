name: agent-station
label: Agent Station
version: 3.0.2
description: >-
  Agent Station — read-only desktop page for the focused chat: the main agent and its
  delegate_task subagents (what each works on, its files, answer and cost, earlier runs in a
  picker), the chat's background shell commands (running and finished, with exit code and
  output tail), and a Replay of the file edits made after each request; plus a status-bar
  progress chip (and pet line) for the running batch.
author: Muhammed Enes Alpler
license: MIT
requires_hermes: ">=0.21.7"
kind: standalone
