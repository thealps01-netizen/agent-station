# The panel against the NEWEST Hermes core, once a week: the latest GitHub release (what users run)
# and the head of `main` (early warning). ci.yml proves the oldest supported core (CORE_SHA, v0.21.7);
# this workflow proves the newest. A red run here means the core moved something the panel reads:
# the failing step names it. Fix the panel (or the contract) and, if the floor changes, move
# `requires_hermes`, the README range and ci.yml's CORE_SHA together.
#
# live.py (the measured Electron render) is not run here: it needs the core's built desktop app and
# its Electron plus a display, and installing and building `apps/desktop` on every run is slow and
# flaky. It stays a local pre-release step. The canary run stays in ci.yml.
name: Newest core

on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  CORE_REPO: https://github.com/NousResearch/hermes-agent.git
  CORE_API_REPO: NousResearch/hermes-agent

jobs:
  gates:
    name: gates (core ${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        core: [release, main]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install the gate dependencies
        run: |
          python -m pip install --quiet "fastapi==0.115.*" "psutil==7.2.2"
          (cd tests && npm ci)

      - name: Core sources (sparse, newest ${{ matrix.core }})
        env:
          GH_TOKEN: ${{ github.token }}
          CORE: ${{ matrix.core }}
        run: |
          set -euo pipefail
          # The latest release comes from GitHub's "latest release" API, never from sorting tags:
          # calendar tags such as v2026.9.24 sort above v0.22.2.
          if [ "$CORE" = release ]; then
            ref=$(gh api "repos/$CORE_API_REPO/releases/latest" --jq .tag_name)
          else
            ref=main
          fi
          test -n "$ref" || { echo "could not resolve the $CORE core"; exit 1; }
          core="$RUNNER_TEMP/hermes-core"
          git init -q "$core"
          git -C "$core" remote add origin "$CORE_REPO"
          git -C "$core" sparse-checkout init --no-cone
          # Same sparse set as ci.yml. MSYS_NO_PATHCONV keeps the step runnable from Git Bash too.
          MSYS_NO_PATHCONV=1 git -C "$core" sparse-checkout set /hermes_state_common.py /tools/ /agent/conversation_compression.py /agent/usage_pricing.py /agent/context_compressor.py \
            /tui_gateway/contracts/ /tui_gateway/server.py /tui_gateway/agent_factory.py /apps/desktop/src/sdk/ /apps/desktop/src/contrib/plugin.ts
          for i in 1 2 3; do git -C "$core" fetch -q --depth 1 origin "$ref" && break; sleep $((i*20)); done
          git -C "$core" checkout -q FETCH_HEAD
          test -f "$core/hermes_state_common.py" || { echo "core sources missing"; exit 1; }
          sha=$(git -C "$core" rev-parse HEAD)
          echo "Hermes core \`$CORE\`: ref \`$ref\`, commit \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "HERMES_AGENT_DIR=$core" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hermes-home"
          echo "HERMES_HOME=$RUNNER_TEMP/hermes-home" >> "$GITHUB_ENV"

      - name: Backend (fixture state.db, the core's V4A parser)
        working-directory: tests
        run: python check_api.py

      - name: Render and behaviour (jsdom)
        working-directory: tests
        run: node render_check.mjs

      - name: Core contract
        working-directory: tests
        run: python contract_core.py

      - name: Core contract selftest
        working-directory: tests
        run: python contract_core.py --selftest
